name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: ktlint
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod a+x ktlint
          ./ktlint "app/src/**/*.kt"

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Jacoco coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: app/build/reports/jacoco/jacocoTestReport/html
          retention-days: 14

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kompass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # Not a hard gate -- new permissions can be entirely legitimate. This just makes sure they
  # never slip in unnoticed, per the README's documented "keep the permissions table honest"
  # convention.
  permission-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for new Android permissions
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          ADDED=$(git diff "origin/${{ github.base_ref }}...HEAD" -- app/src/main/AndroidManifest.xml | grep '^+.*uses-permission' || true)
          if [ -n "$ADDED" ]; then
            echo "::warning::This PR adds a new permission to AndroidManifest.xml -- make sure README.md's Permissions table is updated:"
            echo "$ADDED"
          fi
